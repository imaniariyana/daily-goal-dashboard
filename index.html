<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Dashboard App</title>
    <link rel="stylesheet" href="./styles/index.css" />
    <link rel="stylesheet" href="./styles/dailygoals.css" />
    <link rel="stylesheet" href="./styles/habittracker.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="dashboard">
      <h1>Daily Dashboard</h1>

      <section class="goals">
        <div class="goals-header">
          <h2>Today's Goals</h2>
          <p class="progress">0/0 completed</p>
        </div>
        <ul class="goal-list"></ul>
        <form class="goal-form">
          <div class="goal-form-row">
            <input
              type="text"
              id="goal-input"
              placeholder="Enter a new goal..."
            />
            <button type="submit" id="add-goal-btn">Add Goal</button>
          </div>
        </form>
      </section>
      <section class="habit-card">
        <h2>Habit Tracker</h2>
        <form id="habit-form">
          <input id="habit-emoji" placeholder="Emoji" maxlength="2" />
          <input id="habit-name" placeholder="Habit name" required />
          <button type="submit">Add Habit</button>
        </form>

        <div class="habit-header">
          <span></span>
          <span>Mon</span>
          <span>Tue</span>
          <span>Wed</span>
          <span>Thu</span>
          <span>Fri</span>
          <span>Sat</span>
          <span>Sun</span>
        </div>

        <div id="habit-list"></div>
      </section>
    </main>
    <script type="module" src="./scripts/index.js"></script>
  </body>
</html>
